<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="WDD 231 JavaScript modules activity"
  >

  <meta name="author" content="Timothy Klintsov">

  <title>Modules Example: Course and Sections</title>

  <link rel="stylesheet" href="styles/modules.css">

  <script type="module" src="scripts/modules.mjs"></script>
</head>

<body>

  <main>

    <section class="course-card">

      <h1 id="course-title"></h1>
      <p id="course-code"></p>

      <div class="controls">

        <div class="section-select">
          <label for="sectionNumber">
            Choose a section:
          </label>

          <select id="sectionNumber"></select>
        </div>

        <button id="enrollStudent" type="button">
          Enroll a Student
        </button>

        <button id="dropStudent" type="button">
          Drop a Student
        </button>

      </div>

      <table>
        <thead>
          <tr>
            <th scope="col">Section</th>
            <th scope="col">Enrolled</th>
            <th scope="col">Instructor</th>
          </tr>
        </thead>

        <tbody id="sections"></tbody>
      </table>

    </section>

  </main>

</body>

</html>
